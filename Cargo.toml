[workspace]
members = ["crates/arx", "crates/arx-cli", "crates/arx-mcp"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
anyhow = "1"
rand = "0.8"
hex = "0.4"
tokio = { version = "1", features = ["rt", "macros"] }
clap = { version = "4", features = ["derive"] }
rmcp = { version = "0.1", features = ["server", "transport-io"] }
tempfile = "3"
topo-core = { path = "../topo/crates/topo-core" }
topo-score = { path = "../topo/crates/topo-score" }
